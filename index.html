<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Средство восстановления системы</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0b0f14;color:#e8eef4;overflow:hidden}
  #stage{position:fixed;inset:0}
  .screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}

  /* ---- стартовый оверлей ---- */
  #start{position:fixed;inset:0;background:linear-gradient(160deg,#0e1620,#05070a);display:flex;align-items:center;justify-content:center;z-index:50}
  .win{width:min(520px,92vw);background:#1b2430;border:1px solid #2e3d4f;border-radius:10px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
  .win-bar{background:linear-gradient(#2a3646,#223041);padding:9px 12px;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#bcd}
  .win-bar .x{opacity:.7;cursor:pointer}
  .win-body{padding:26px 24px;text-align:center}
  .shield{font-size:52px;margin-bottom:10px}
  .win-body p{line-height:1.5;color:#cfe0ee;margin-bottom:16px}
  .hint{font-size:12px;color:#7e93a8}
  button{font:inherit;cursor:pointer;border:none;border-radius:8px;padding:11px 22px}
  #start-btn{background:#2d7ff9;color:#fff;font-weight:600;font-size:16px;width:100%}
  #start-btn:hover{background:#4890ff}

  /* ---- сообщения (диалоги) ---- */
  .dialog{width:min(480px,92vw);background:#1c2531;border:1px solid #33465c;border-radius:10px;box-shadow:0 24px 70px rgba(0,0,0,.65);overflow:hidden;text-align:left;animation:pop .18s ease-out}
  .dialog .bar{background:linear-gradient(#2b394a,#233142);padding:8px 12px;display:flex;justify-content:space-between;font-size:13px;color:#cfe0ee}
  .dialog .bar span.x{cursor:pointer;opacity:.75}
  .dialog .body{padding:22px 20px;display:flex;gap:16px;align-items:flex-start}
  .dialog .ico{font-size:34px}
  .dialog h3{font-size:17px;margin-bottom:8px;color:#fff}
  .dialog p{font-size:14px;line-height:1.55;color:#c6d6e6}
  .dialog .btns{padding:0 20px 18px;display:flex;gap:10px;justify-content:flex-end}
  .dialog .btns button{background:#2d7ff9;color:#fff;padding:8px 20px;font-size:14px}
  .dialog .btns button.alt{background:#31404f}
  .fade-bg{position:absolute;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center}

  /* ---- фейковое удаление ---- */
  .del{background:#05070a;justify-content:flex-start;padding:0}
  .term{width:100%;flex:1;padding:54px 22px 18px;font-family:Menlo,Consolas,monospace;font-size:13.5px;line-height:1.7;color:#ff5f56;overflow:hidden;text-align:left}
  .term .ok{color:#6ee7a0}
  .term .dim{color:#7f93a8}
  .del .bottom{width:100%;padding:18px 22px 26px;background:#0b0f14;border-top:1px solid #1d2836}
  .del h2{font-size:17px;color:#ffb4b0;margin-bottom:12px}
  .prog{height:14px;background:#1a2432;border-radius:7px;overflow:hidden}
  .prog>div{height:100%;width:0;background:linear-gradient(90deg,#ff4d4d,#ff9a3d);transition:width .2s}
  .pct{margin-top:8px;font-family:Menlo,monospace;color:#ffb4b0;font-size:14px}
  @keyframes blink{50%{opacity:.35}}
  .cursor{display:inline-block;width:9px;height:16px;background:#ff5f56;animation:blink .8s steps(1) infinite;vertical-align:-2px}

  /* ---- отчёт ---- */
  .report{background:linear-gradient(160deg,#1d0a0a,#0a0404)}
  .rep-window{width:min(720px,94vw);background:#16100f;border:1px solid #7a2b2b;border-radius:10px;box-shadow:0 30px 80px rgba(120,0,0,.5);overflow:hidden;text-align:left}
  .rep-bar{background:linear-gradient(#a32020,#7d1717);padding:10px 14px;font-size:14px;font-weight:700;color:#ffe3e3;display:flex;justify-content:space-between;align-items:center}
  .rep-bar .lock{font-weight:400;font-size:12px;animation:blink 1s steps(1) infinite}
  .rep-list{list-style:none;padding:16px 18px;min-height:230px;font-size:14.5px}
  .rep-list li{padding:7px 0;border-bottom:1px dashed #3a2323;color:#f0c9c9;display:flex;justify-content:space-between;gap:14px}
  .rep-list li b{color:#ff6b6b;font-family:Menlo,monospace}
  .rep-list li .st{color:#ff9f9f;font-size:12px;align-self:center}
  .rep-foot{padding:12px 18px 16px;background:#0f0808;border-top:1px solid #3a2323;font-size:13px;color:#e0a8a8}
  .rep-foot b{color:#ff6b6b}
  .rep-note{margin-top:8px;font-size:12px;color:#a97}

  /* ---- скример ---- */
  .screamer{position:fixed;inset:0;z-index:99;background:#000;display:flex;align-items:center;justify-content:center;animation:shake .09s infinite}
  .screamer svg{width:min(96vw,900px);height:auto;filter:contrast(1.15)}
  .screamer .flash{position:absolute;inset:0;background:#a00;mix-blend-mode:screen;animation:flash .35s steps(1) infinite}
  @keyframes flash{50%{background:#000}}
  @keyframes shake{0%{transform:translate(0,0) scale(1.02)}25%{transform:translate(-9px,5px) scale(1.05)}50%{transform:translate(8px,-7px) scale(1.03)}75%{transform:translate(-6px,-5px) scale(1.06)}100%{transform:translate(7px,6px) scale(1.04)}}
  @keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
  @keyframes shakeWin{0%,100%{transform:translateX(0)}20%{transform:translateX(-12px)}40%{transform:translateX(11px)}60%{transform:translateX(-8px)}80%{transform:translateX(7px)}}

  /* ---- синий экран ---- */
  .bsod{background:#0078d7;color:#fff;text-align:left;align-items:flex-start;justify-content:center;gap:18px;padding:8vh 10vw}
  .bsod .sad{font-size:90px;line-height:1}
  .bsod h1{font-size:23px;font-weight:500;max-width:760px}
  .bsod p{font-size:15px;max-width:760px;line-height:1.6}
  .bsod .code{font-family:Menlo,monospace;font-size:13px;opacity:.85;margin-top:24px}
  .bsod .qr{width:92px;height:92px;background:
     repeating-linear-gradient(0deg,#fff 0 8px,#0078d7 8px 16px),
     repeating-linear-gradient(90deg,rgba(255,255,255,.85) 0 8px,transparent 8px 16px);
     border:6px solid #fff;position:absolute;right:8vw;bottom:8vh}

  /* ---- восстановление ---- */
  .res{background:linear-gradient(160deg,#0d1f17,#050a08)}
  .res .big{font-size:58px;margin-bottom:14px}
  .res h1{font-size:24px;color:#9ff5c8;margin-bottom:10px}
  .res p{color:#bfe8d4;margin-bottom:22px;font-size:15px}
  .res .prog{width:min(560px,90vw);height:16px;background:#12281e}
  .res .prog>div{background:linear-gradient(90deg,#28d17c,#7dffbe)}
  .res .pct{color:#9ff5c8}
  .res .files{margin-top:18px;font-family:Menlo,monospace;font-size:13px;color:#7dd8a8;height:120px;overflow:hidden;text-align:left;width:min(560px,90vw)}

  /* ---- финал ---- */
  .free{background:radial-gradient(circle at 50% 30%,#12331f,#06110b);color:#eafff2}
  .free .big{font-size:74px;margin-bottom:8px}
  .free h1{font-size:30px;color:#7dffbe;margin-bottom:14px}
  .free p{max-width:640px;line-height:1.65;color:#cfeedd;font-size:16px;margin-bottom:10px}
  .free .note{font-size:13px;color:#7f9c8c;margin-bottom:26px}
  .free .btns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
  .free .btns .primary{background:#28d17c;color:#04170e;font-weight:700}
  .free .btns .ghost{background:#173526;color:#9ff5c8}

  .alarm{position:absolute;top:0;left:0;right:0;background:#c62828;color:#fff;text-align:center;padding:7px;font-size:13px;letter-spacing:.5px;animation:blink 1s steps(1) infinite}
</style>
</head>
<body>

<div id="start">
  <div class="win">
    <div class="win-bar"><span>🛡 Антивирус «Страж» — проверка системы</span><span class="x">✕</span></div>
    <div class="win-body">
      <div class="shield">🛡️</div>
      <p id="start-text">Обнаружена критическая угроза. Нажмите «Начать проверку», чтобы запустить <b>средство восстановления системы</b>.</p>
      <button id="start-btn">▶ Начать проверку</button>
      <p class="hint">Сеанс защищён. Не закрывайте окно до завершения проверки.</p>
    </div>
  </div>
</div>

<div id="stage"></div>

<script>
"use strict";

/* ========== конфигурация ========== */
const DEFAULT_CFG = {
  sound: true,
  events: [
    {t: 1,  type: "message",  title: "Обнаружена угроза!", text: "Троян.Virus.9001 обнаружен в ваших файлах. Начинается срочное удаление..."},
    {t: 6,  type: "delete",   duration: 9},
    {t: 16, type: "report",   duration: 5},
    {t: 22, type: "screamer", duration: 1.8},
    {t: 24, type: "bsod",     duration: 5},
    {t: 29, type: "restore",  duration: 6},
    {t: 36, type: "freedom",  text: "Контроль над компьютером освобождён!"}
  ]
};

function b64url(obj){
  const bytes = new TextEncoder().encode(JSON.stringify(obj));
  let bin = ""; bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
function unb64url(str){
  try{
    str = str.replace(/-/g,"+").replace(/_/g,"/");
    const bin = atob(str);
    const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
    return JSON.parse(new TextDecoder().decode(bytes));
  }catch(e){ return null; }
}
function loadCfg(){
  const m = location.hash.match(/cfg=([^&]+)/);
  if(m){
    const c = unb64url(decodeURIComponent(m[1]));
    if(c && Array.isArray(c.events) && c.events.length) return c;
  }
  return DEFAULT_CFG;
}
const CFG = loadCfg();

/* ========== звук (WebAudio, без файлов) ========== */
const SFX = {
  ctx: null,
  on: CFG.sound !== false,
  init(){
    if(!this.ctx){
      try{ this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    }
    if(this.ctx && this.ctx.state === "suspended") this.ctx.resume();
  },
  tone(f1, f2, dur, type, vol, delay){
    if(!this.on || !this.ctx) return;
    type = type || "square"; vol = vol || .1; delay = delay || 0;
    const t = this.ctx.currentTime + delay;
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type;
    o.frequency.setValueAtTime(f1, t);
    if(f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(.0008, t + dur);
    o.connect(g); g.connect(this.ctx.destination);
    o.start(t); o.stop(t + dur + .03);
  },
  noise(dur, vol, cut){
    if(!this.on || !this.ctx) return;
    const t = this.ctx.currentTime;
    const n = Math.floor(this.ctx.sampleRate * dur);
    const buf = this.ctx.createBuffer(1, n, this.ctx.sampleRate);
    const d = buf.getChannelData(0);
    for(let i = 0; i < n; i++) d[i] = (Math.random()*2 - 1) * (1 - i/n);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = cut || 6000;
    const g = this.ctx.createGain(); g.gain.value = vol || .25;
    src.connect(f); f.connect(g); g.connect(this.ctx.destination);
    src.start(t);
  },
  error(){ this.tone(880, 440, .17, "square", .09); this.tone(660, 330, .22, "square", .09, .16); },
  ok(){ this.tone(523, 523, .1, "sine", .11); this.tone(784, 784, .2, "sine", .11, .11); },
  tick(){ this.tone(1400, 1400, .025, "square", .03); },
  scream(){ this.tone(1300, 170, 1.4, "sawtooth", .3); this.tone(70, 44, 1.7, "sine", .4); this.tone(1900, 850, 1.2, "square", .13); this.noise(1.5, .3, 5000); },
  buzz(){ this.tone(140, 55, 1.3, "sawtooth", .18); },
  chime(){ this.tone(440, 880, .16, "sine", .1); this.tone(660, 1320, .2, "sine", .1, .18); }
};

/* ========== движок ========== */
const stage = document.getElementById("stage");
const timers = [];
const intervals = [];

function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function every(fn, ms){ const id = setInterval(fn, ms); intervals.push(id); return id; }
function clearAll(){ timers.forEach(clearTimeout); intervals.forEach(clearInterval); timers.length = 0; intervals.length = 0; }

function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
}

const REPORT_ITEMS = [
  ["Файлы: документы, фото, видео", "8 412"],
  ["Папки пользователей", "316"],
  ["Привязанные аккаунты и входы", "7"],
  ["Каналы, подписки, ключи доступа", "12"],
  ["Системные журналы и кэш", "96"],
  ["Резервные копии", "удалены"]
];

const FAKE_DIRS = [
  "C:\\Users\\Admin\\Документы\\отчёт_2024.xlsx",
  "C:\\Users\\Admin\\Рабочий стол\\диплом.docx",
  "C:\\Users\\Admin\\Изображения\\фото_отпуск.png",
  "C:\\Users\\Admin\\Загрузки\\важное_архив.zip",
  "C:\\Users\\Admin\\Видео\\свадьба_клип.mp4",
  "C:\\Users\\Admin\\Музыка\\плейлист_2019.mp3",
  "D:\\Работа\\проекты\\клиент_итоги.psd",
  "D:\\Работа\\база\\договоры_база.sql",
  "C:\\Windows\\System32\\drivers\\etc\\hosts.bak",
  "C:\\Users\\Admin\\Документы\\пароли_заметки.txt",
  "C:\\Users\\Admin\\Календарь\\планы_на_год.ics",
  "C:\\ProgramData\\Служебное\\логи_конфиденциально.dat"
];

const TYPE_LABEL = {
  message: "Сообщение", delete: "Фейковое удаление", report: "Отчёт об удалении",
  screamer: "Скример", bsod: "Синий экран", restore: "Восстановление", freedom: "Освобождение ПК"
};

/* окно нельзя закрыть во время «удаления» */
function block(e){ e.preventDefault(); e.returnValue = ""; return ""; }
function lockWindow(){ window.addEventListener("beforeunload", block); }
function unlockWindow(){ window.removeEventListener("beforeunload", block); }

function dispatch(ev){
  switch(ev.type){
    case "message":  return renderMessage(ev);
    case "delete":   return renderDelete(ev);
    case "report":   return renderReport(ev);
    case "screamer": return renderScreamer(ev);
    case "bsod":     return renderBsod(ev);
    case "restore":  return renderRestore(ev);
    case "freedom":  return renderFreedom(ev);
  }
}

function renderMessage(ev){
  stage.innerHTML = `
    <div class="fade-bg">
      <div class="dialog">
        <div class="bar"><span>${esc(ev.title || "Системное сообщение")}</span><span class="x js-x">✕</span></div>
        <div class="body">
          <div class="ico">⚠️</div>
          <div><h3>${esc(ev.title || "Предупреждение")}</h3><p>${esc(ev.text || "")}</p></div>
        </div>
        <div class="btns"><button class="alt">Отмена</button><button>OK</button></div>
      </div>
    </div>`;
  SFX.error();
  stage.querySelectorAll(".btns button").forEach(b => b.onclick = () => { SFX.error(); });
  const dlg = stage.querySelector(".dialog");
  const x = stage.querySelector(".bar .x");
  if(x) x.onclick = () => {
    SFX.error();
    dlg.style.animation = "none"; void dlg.offsetWidth;
    dlg.style.animation = "shakeWin .35s";
  };
}

function renderDelete(ev){
  const dur = (ev.duration || 9) * 1000;
  stage.innerHTML = `
    <div class="screen del">
      <div class="alarm">⛔ ИДЁТ УДАЛЕНИЕ ФАЙЛОВ — ПРОЦЕСС НЕОБРАТИМ ⛔</div>
      <div class="term" id="term"></div>
      <div class="bottom">
        <h2>Уничтожение данных пользователя…</h2>
        <div class="prog"><div id="pb"></div></div>
        <div class="pct" id="pct">0%</div>
      </div>
    </div>`;
  const term = document.getElementById("term");
  const pb = document.getElementById("pb");
  const pct = document.getElementById("pct");
  const t0 = performance.now();
  let i = 0;
  const addLine = () => {
    const f = FAKE_DIRS[i % FAKE_DIRS.length];
    i++;
    const el = document.createElement("div");
    el.innerHTML = `<span class="dim">[Удаление]</span> ${esc(f)} <span>— УДАЛЁН</span>`;
    term.appendChild(el);
    while(term.children.length > 14) term.removeChild(term.firstChild);
    if(i % 3 === 0) SFX.tick();
  };
  addLine();
  every(() => {
    const p = Math.min(100, Math.round((performance.now() - t0) / dur * 100));
    pb.style.width = p + "%";
    pct.textContent = p + "%  (" + Math.round(p / 100 * 8412) + " / 8412 файлов)";
    addLine();
  }, dur / 22);
}

const SCREAM_SVG = `
<svg viewBox="0 0 1000 620" xmlns="http://www.w3.org/2000/svg">
  <rect width="1000" height="620" fill="#000"/>
  <ellipse cx="500" cy="310" rx="235" ry="295" fill="#dfd2b8"/>
  <ellipse cx="500" cy="310" rx="235" ry="295" fill="none" stroke="#7a6c55" stroke-width="6"/>
  <path d="M300 130 Q400 70 480 105" stroke="#8a7a63" stroke-width="7" fill="none"/>
  <path d="M700 130 Q600 70 520 105" stroke="#8a7a63" stroke-width="7" fill="none"/>
  <path d="M275 245 L445 225 L455 315 L285 325 Z" fill="#000"/>
  <path d="M725 245 L555 225 L545 315 L715 325 Z" fill="#000"/>
  <circle cx="370" cy="278" r="17" fill="#fff"/>
  <circle cx="630" cy="278" r="17" fill="#fff"/>
  <circle cx="374" cy="282" r="7" fill="#000"/>
  <circle cx="634" cy="282" r="7" fill="#000"/>
  <path d="M360 395 Q500 575 640 395 Q500 470 360 395 Z" fill="#050505"/>
  <g fill="#e8e2d2">
    <rect x="392" y="396" width="34" height="30"/><rect x="436" y="400" width="34" height="34"/>
    <rect x="480" y="403" width="36" height="36"/><rect x="526" y="400" width="34" height="34"/>
    <rect x="570" y="396" width="34" height="30"/>
    <rect x="415" y="470" width="30" height="26"/><rect x="465" y="482" width="32" height="28"/>
    <rect x="515" y="482" width="32" height="28"/><rect x="560" y="470" width="30" height="26"/>
  </g>
  <path d="M470 330 L500 375 L530 330" stroke="#9b8b70" stroke-width="6" fill="none"/>
  <path d="M300 370 Q330 395 320 430" stroke="#a5967c" stroke-width="5" fill="none"/>
  <path d="M700 370 Q670 395 680 430" stroke="#a5967c" stroke-width="5" fill="none"/>
  <text x="500" y="600" text-anchor="middle" font-family="Arial" font-size="34" fill="#f33" font-weight="bold">ТЫ ЗАРАЖЁН 😱</text>
</svg>`;

function renderReport(ev){
  const dur = (ev.duration || 5) * 1000;
  stage.innerHTML = `
    <div class="screen report">
      <div class="rep-window">
        <div class="rep-bar"><span>📋 ОТЧЁТ ОБ УДАЛЕНИИ — System Report</span><span class="lock">🔒 ОКНО ЗАБЛОКИРОВАНО</span></div>
        <ul class="rep-list" id="rep-list"></ul>
        <div class="rep-foot">Итого удалено: <b id="rep-sum">0</b> объектов
          <div class="rep-note">Отчёт сформирован и передан в службу безопасности устройства</div>
        </div>
      </div>
    </div>`;
  const list = document.getElementById("rep-list"), sum = document.getElementById("rep-sum");
  let i = 0, total = 0;
  const step = () => {
    if(i >= REPORT_ITEMS.length) return;
    const item = REPORT_ITEMS[i++];
    total += parseInt(String(item[1]).replace(/\D/g, "")) || 0;
    const li = document.createElement("li");
    li.innerHTML = `<span>${esc(item[0])}</span><b>${esc(item[1])}</b><span class="st">УДАЛЕНО</span>`;
    list.appendChild(li);
    sum.textContent = total.toLocaleString("ru-RU");
    SFX.error();
  };
  step();
  [.18, .36, .54, .72, .88].forEach(f => later(step, dur * f));
}

function renderScreamer(ev){
  const dur = (ev.duration || 1.8) * 1000;
  const ov = document.createElement("div");
  ov.className = "screamer";
  ov.innerHTML = `<div class="flash"></div>${SCREAM_SVG}`;
  document.body.appendChild(ov);
  SFX.scream();
  later(() => ov.remove(), dur);
}

function renderBsod(ev){
  const dur = (ev.duration || 5) * 1000;
  stage.innerHTML = `
    <div class="screen bsod">
      <div class="sad">:(</div>
      <h1>Ваш компьютер столкнулся с проблемой и перезагружается.</h1>
      <p>Мы только что собрали информацию об ошибке, а затем отправили её в службу поддержки.<br>
      <span id="bsod-pct">0%</span> выполнено</p>
      <p class="code">STOP: 0xPRANK_NOT_A_VIRUS — это шутка, настоящего сбоя нет</p>
      <div class="qr"></div>
    </div>`;
  SFX.buzz();
  const t0 = performance.now();
  const el = document.getElementById("bsod-pct");
  every(() => { el.textContent = Math.min(100, Math.round((performance.now() - t0) / dur * 100)) + "%"; }, 150);
}

function renderRestore(ev){
  const dur = (ev.duration || 6) * 1000;
  stage.innerHTML = `
    <div class="screen res">
      <div class="big">♻️</div>
      <h1>Восстановление файлов из резервной копии…</h1>
      <p>Найдена резервная копия от сегодня. Идёт возврат данных.</p>
      <div class="prog"><div id="pb"></div></div>
      <div class="pct" id="pct">0%</div>
      <div class="files" id="files"></div>
    </div>`;
  const pb = document.getElementById("pb"), pct = document.getElementById("pct"), files = document.getElementById("files");
  const t0 = performance.now();
  let i = 0;
  every(() => {
    const p = Math.min(100, Math.round((performance.now() - t0) / dur * 100));
    pb.style.width = p + "%";
    pct.textContent = p + "%";
    const f = FAKE_DIRS[i++ % FAKE_DIRS.length];
    const line = document.createElement("div");
    line.innerHTML = `<span style="color:#7dffbe">✓ Восстановлен:</span> ${esc(f)}`;
    files.appendChild(line);
    while(files.children.length > 6) files.removeChild(files.firstChild);
    if(i % 2 === 0) SFX.chime();
  }, dur / 20);
}

function renderFreedom(ev){
  unlockWindow();
  stage.innerHTML = `
    <div class="screen free">
      <div class="big">🎉</div>
      <h1>${esc(ev.text || "Контроль над компьютером освобождён!")}</h1>
      <p>Все «удалённые» файлы на месте — ничего настоящего не пострадало.</p>
      <p>Расслабься, это была <b>шутка</b> 😄: ни вирусов, ни удаления — только испуг.</p>
      <p class="note">Esc — выйти из полноэкранного режима.</p>
      <div class="btns">
        <button class="primary" id="closeBtn">😄 Классно, закрыть</button>
        <button class="ghost" id="againBtn">🔁 Ещё раз</button>
      </div>
    </div>`;
  SFX.ok(); later(() => SFX.ok(), 250);
  document.getElementById("closeBtn").onclick = () => {
    SFX.ok();
    if(document.fullscreenElement) document.exitFullscreen().catch(() => {});
    stage.innerHTML = `
      <div class="screen free">
        <div class="big">👋</div>
        <h1>Пранк окончен</h1>
        <p>Можно закрывать вкладку.</p>
      </div>`;
  };
  document.getElementById("againBtn").onclick = () => location.reload();
}

/* ========== запуск ========== */
function runTimeline(){
  const events = CFG.events.slice().sort((a, b) => (a.t || 0) - (b.t || 0));
  events.forEach(ev => later(() => dispatch(ev), Math.max(0, (ev.t || 0) * 1000)));
}

document.getElementById("start-btn").onclick = () => {
  SFX.init();
  SFX.on = CFG.sound !== false;
  lockWindow();
  const el = document.documentElement;
  const req = el.requestFullscreen || el.webkitRequestFullscreen;
  if(req){ try{ req.call(el); }catch(e){} }
  document.getElementById("start").remove();
  runTimeline();
};
</script>
</body>
</html>
